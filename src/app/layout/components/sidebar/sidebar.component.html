<aside class="sidebar" [class.collapsed]="isCollapsed()">

  <!-- En-tête -->
  <div class="sidebar-header">
    <img src="assets/images/ujkz.png" alt="Logo" class="sidebar-logo" />
    @if (!isCollapsed()) {
      <div class="sidebar-brand">
        <span class="brand-name">GestionVoyage</span>
        <span class="brand-sub">Université</span>
      </div>
    }
    <button class="collapse-btn" (click)="toggleCollapse()" title="Réduire le menu">
      @if (isCollapsed()) {
        <!-- Chevron droite -->
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
        </svg>
      } @else {
        <!-- Chevron gauche -->
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
        </svg>
      }
    </button>
  </div>

  <!-- Navigation -->
  <nav class="sidebar-nav">
    @if (!isCollapsed()) {
      <span class="section-label">Administration</span>
    }

    @for (item of menuItems; track item.label) {
      <div class="nav-item">

        <!-- Bouton principal -->
        <button
          class="nav-btn"
          [class.active]="isExpanded(item.label)"
          [title]="item.label"
          (click)="toggleItem(item.label)"
        >
          <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
            <path [attr.d]="item.iconPath" />
          </svg>
          @if (!isCollapsed()) {
            <span class="nav-label">{{ item.label }}</span>
            <svg class="chevron" [class.open]="isExpanded(item.label)" viewBox="0 0 24 24" fill="currentColor">
              <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/>
            </svg>
          }
        </button>

        <!-- Sous-menu -->
        @if (!isCollapsed() && isExpanded(item.label)) {
          <ul class="sub-menu">
            @for (child of item.children; track child.label) {
              <li class="sub-item">
                <button class="sub-btn">{{ child.label }}</button>
              </li>
            }
          </ul>
        }

      </div>
    }
  </nav>

</aside>
